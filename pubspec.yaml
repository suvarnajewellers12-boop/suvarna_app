name: suvarna_jewellers
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  razorpay_flutter: ^1.3.7
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  vibration: ^3.0.0
  local_auth: ^2.3.0          # ← ADDED: fingerprint / face biometrics

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/suvarna_logo.png
    - assets/images/showroom_bg.png
    - assets/images/products/gold_necklace.png
    - assets/images/products/gold_bangles.png
    - assets/images/products/gold_ring.png
    - assets/images/products/gold_chain.png
    - assets/images/products/gold_earrings.png
    - assets/images/products/silver_idol.png
    - assets/images/products/silver_bangles.png
    - assets/images/products/silver_chain.png
    - assets/images/products/silver_ring.png

flutter_native_splash:
  color: "#F5EBDD"
  image: assets/images/suvarna_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/suvarna_logo.png